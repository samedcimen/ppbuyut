name: Platform health

# Twice a day, reads the live service status (/api/status). If a platform is
# down, it opens an issue (one at a time, updated on later runs) that mentions
# the owner, so GitHub sends an e-mail. When everything works again, the issue
# is closed with a note. "Degraded" (only a small photo) is listed but doesn't
# open an issue on its own: Instagram does that now and then.
#
# A platform that looks down is checked again after 35 minutes, and only one
# still down then counts. Single failed searches mark a platform down for 15
# minutes and probe results are kept for 30, so the second look is always a
# fresh one; short hiccups no longer send an e-mail.
on:
  schedule:
    - cron: "17 6,18 * * *" # 09:17 and 21:17 Turkey time
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const site = "https://ppbuyut.com";
            const label = "platform-health";
            const owner = context.repo.owner;

            const RECHECK_MINUTES = 35;

            async function readStatus() {
              try {
                // A query string skips the CDN copy of the status (cached for a minute).
                const res = await fetch(`${site}/api/status?t=${Date.now()}`, { signal: AbortSignal.timeout(60_000) });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                return (await res.json()).platforms;
              } catch (err) {
                core.warning(`Status endpoint unreachable: ${err.message}`);
                return null;
              }
            }
            const isDown = (list) => new Set((list ?? []).filter((p) => p.state === "down").map((p) => p.platform));

            let platforms = await readStatus();
            const firstDown = isDown(platforms);
            if (platforms === null || firstDown.size > 0) {
              const what = platforms === null ? "status unreachable" : [...firstDown].join(", ");
              core.info(`Looks down (${what}); checking again in ${RECHECK_MINUTES} minutes.`);
              await new Promise((resolve) => setTimeout(resolve, RECHECK_MINUTES * 60_000));
              const again = await readStatus();
              if (again !== null && platforms === null) {
                platforms = again; // the site answers again: trust the fresh result
              } else if (again !== null) {
                // A platform counts as down only if it was down both times.
                platforms = again.map((p) => (p.state === "down" && !firstDown.has(p.platform) ? { ...p, state: "up" } : p));
                for (const name of firstDown) if (!isDown(again).has(name)) core.info(`${name} recovered on the second look.`);
              }
              // again === null: still (or newly) unreachable; keep the first result.
            }

            const down = platforms ? platforms.filter((p) => p.state === "down") : [];
            const degraded = platforms ? platforms.filter((p) => p.state === "degraded") : [];
            const broken = platforms === null || down.length > 0;

            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: "open",
              labels: label,
            });
            const issue = open[0];

            const now = new Date().toISOString().replace("T", " ").slice(0, 16) + " UTC";
            const list = (items) => items.map((p) => `- **${p.platform}**`).join("\n");
            const body = [
              platforms === null
                ? `Durum sayfasına ulaşılamadı (${site}/api/status). Site kapalı olabilir.`
                : `Şu an çalışmayan platform(lar):\n\n${list(down)}`,
              degraded.length ? `\nKısıtlı (yalnızca küçük boyut):\n\n${list(degraded)}` : "",
              `\nKontrol: ${now} · [Platformlar sayfası](${site}/platformlar) · [Durum verisi](${site}/api/status)`,
              `\n@${owner}`,
            ].join("\n");

            if (broken && !issue) {
              await github.rest.issues.create({
                ...context.repo,
                title: platforms === null ? "Site durumu okunamadı" : `Çalışmayan platform: ${down.map((p) => p.platform).join(", ")}`,
                body,
                labels: [label],
              });
              core.notice("Opened a health issue.");
            } else if (broken && issue) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body });
              core.notice(`Updated issue #${issue.number}.`);
            } else if (!broken && issue) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Tüm platformlar yeniden çalışıyor (${now}). Kapatılıyor.`,
              });
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: "closed" });
              core.notice(`Closed issue #${issue.number}.`);
            } else {
              core.notice(`All ${platforms.length} platforms are up.`);
            }
